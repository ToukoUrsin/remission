# Merged on top of Harbor's base compose file. Harbor configures `main` (build
# context = this directory, command, log mounts, resource limits); we only add
# the sidecar and make `main` wait for it.
services:
  main:
    depends_on:
      remission:
        condition: service_healthy

  remission:
    build:
      # Assembled by scripts/new_task.py: Dockerfile + requirements.txt + the
      # `remission` package (cell model, hidden patient generator, lab, server).
      # The agent's container never sees it.
      context: ./sidecar
    environment:
      # Sidecar-only. Never move these to task.toml [environment.env]: that
      # table is injected into `main`, where the agent can read it.
      REMISSION_SEED: "2014354864"
      REMISSION_WELLS: "384"
      REMISSION_LAB_DAYS: "28"
      REMISSION_ADMIN_TOKEN: "2683413bb5d5380882e6df5ae16ea42345b085317546ce78"
      # A regimen known to cure this patient (found with the hidden parameters); only for the replay viewer.
      REMISSION_BEST_KNOWN: "{\"regimen\": {\"phases\": [{\"days\": 14, \"doses\": {\"EGFRi\": 1.18, \"BCLi\": 1.62}}, {\"days\": 64, \"doses\": {\"EGFRi\": 0.85, \"BCLi\": 1.47}}]}, \"reward\": 0.74}"
    # Explicit networking, and no `expose:`. With a restricted network_mode
    # Harbor moves every service without explicit networking into its
    # egress-control namespace; the service name then stops resolving.
    networks:
      - default
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2)"]
      interval: 2s
      timeout: 5s
      retries: 90
      start_period: 5s
